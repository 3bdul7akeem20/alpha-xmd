<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha-XMD | Deploy Bot</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(-45deg, #0f172a, #2e1065, #4c1d95, #0f172a); background-size: 400% 400%; animation: gradientBG 15s ease infinite; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; color: #fff; }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        .stats-bar { display: flex; gap: 15px; margin-bottom: 20px; background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 50px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .stat-item { font-size: 13px; color: #a1a1aa; display: flex; align-items: center; gap: 5px; }
        .stat-dot { width: 8px; height: 8px; background: #33ff00; border-radius: 50%; box-shadow: 0 0 10px #33ff00; }
        .stat-value { color: #fff; font-weight: 600; }

        .container { width: 100%; max-width: 400px; text-align: center; z-index: 10; }
        .logo { width: 80px; height: 80px; margin: 0 auto 20px; background: rgba(255, 255, 255, 0.1); border-radius: 20px; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); }
        .logo svg { width: 45px; height: 45px; fill: #33ff00; }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; background: -webkit-linear-gradient(45deg, #33ff00, #00ffcc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { font-size: 14px; color: #a1a1aa; margin-bottom: 30px; font-weight: 300; }

        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 30px 25px; border-radius: 24px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); text-align: left; }
        .card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; font-weight: 600; font-size: 16px; color: #e4e4e7; }
        .card-header .icon-bg { background: rgba(51, 255, 0, 0.1); padding: 8px; border-radius: 10px; display: flex; color: #33ff00; }

        .input-group { position: relative; margin-bottom: 20px; }
        .input-group input { width: 100%; padding: 16px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: #fff; font-size: 16px; outline: none; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #33ff00; box-shadow: 0 0 15px rgba(51, 255, 0, 0.2); }
        
        .btn-main { width: 100%; padding: 16px; background: linear-gradient(90deg, #33ff00, #00cc00); color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 4px 15px rgba(51, 255, 0, 0.4); }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(51, 255, 0, 0.6); }
        .btn-main:disabled { background: #3f3f46; color: #a1a1aa; cursor: not-allowed; box-shadow: none; transform: none; }
        
        .btn-danger { width: 100%; padding: 12px; background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        .btn-danger:hover { background: #ef4444; color: #fff; }

        .spinner { display: none; width: 20px; height: 20px; border: 3px solid rgba(0,0,0,0.3); border-radius: 50%; border-top-color: #000; animation: spin 1s ease-in-out infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .result-box { display: none; margin-top: 20px; background: rgba(51, 255, 0, 0.05); border: 1px solid rgba(51, 255, 0, 0.2); border-radius: 16px; padding: 20px; text-align: center; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .result-box h3 { color: #33ff00; font-size: 18px; margin-bottom: 8px; }
        .result-box p { font-size: 13px; color: #a1a1aa; margin-bottom: 15px; }
        .code-display { font-size: 32px; font-weight: 800; letter-spacing: 4px; color: #fff; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; border: 1px dashed #33ff00; margin-bottom: 10px; text-shadow: 0 0 10px rgba(51, 255, 0, 0.5); }
        
        .error-text { display: none; color: #ef4444; font-size: 13px; margin-top: 15px; text-align: center; background: rgba(239, 68, 68, 0.1); padding: 10px; border-radius: 8px; }
    </style>
</head>
<body>

    <div class="stats-bar">
        <div class="stat-item">
            <div class="stat-dot"></div>
            Live Bots: <span class="stat-value" id="liveCount">0</span>
        </div>
    </div>

    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></svg>
        </div>
        
        <h1>ALPHA-XMD</h1>
        <p class="subtitle">Deploy your personal WhatsApp bot in seconds.</p>

        <div class="glass-card">
            <div class="card-header">
                <div class="icon-bg">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
                </div>
                <span id="cardTitle">Pairing Code</span>
            </div>

            <div id="input-area">
                <div class="input-group">
                    <input type="tel" id="phone" placeholder="263784969735 (No + or spaces)">
                </div>
                <button class="btn-main" id="generateBtn" onclick="requestCode()">
                    <span id="btnText">Generate Code</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
            </div>

            <!-- Pairing Result -->
            <div class="result-box" id="resultBox">
                <h3>✅ Code Generated!</h3>
                <p>Link this in WhatsApp > Linked Devices</p>
                <div class="code-display" id="codeDisplay">----</div>
            </div>

            <!-- Manage Session (Shows if already paired) -->
            <div class="result-box" id="manageBox" style="border-color: rgba(255,255,255,0.2); background: rgba(255,255,255,0.05);">
                <h3 style="color:#fff">Bot is Active</h3>
                <p>This number is already running 24/7.</p>
                <button class="btn-danger" id="disconnectBtn" onclick="disconnectBot()">
                    Disconnect Bot
                </button>
            </div>

            <div class="error-text" id="errorText"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://itinerary-splashy-flyer.ngrok-free.dev"; 
        let currentPhone = "";

        // Fetch live stats every 10 seconds
        async function fetchStats() {
            try {
                const res = await fetch(API_URL + "/api/stats", {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await res.json();
                if(data.connected !== undefined) {
                    document.getElementById('liveCount').innerText = data.connected;
                }
            } catch(e) {}
        }
        setInterval(fetchStats, 10000);
        fetchStats();

        async function requestCode() {
            const phone = document.getElementById('phone').value.replace(/[^0-9]/g, '');
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            const errorText = document.getElementById('errorText');
            const resultBox = document.getElementById('resultBox');
            const manageBox = document.getElementById('manageBox');
            const inputArea = document.getElementById('input-area');

            if (phone.length < 10) {
                showError("Please enter a valid number with country code.");
                return;
            }

            currentPhone = phone;
            btn.disabled = true;
            btnText.innerText = "Connecting...";
            spinner.style.display = "block";
            errorText.style.display = "none";
            resultBox.style.display = "none";
            manageBox.style.display = "none";

            try {
                const res = await fetch(API_URL + "/api/pair", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' 
                    },
                    body: JSON.stringify({ phoneNumber: phone })
                });
                
                const data = await res.json();

                if (data.success) {
                    inputArea.style.display = 'none';
                    
                    if (data.alreadyPaired) {
                        document.getElementById('cardTitle').innerText = "Manage Bot";
                        manageBox.style.display = 'block';
                    } else {
                        document.getElementById('cardTitle').innerText = "Link Device";
                        resultBox.style.display = 'block';
                        document.getElementById('codeDisplay').innerText = data.code;
                    }
                } else {
                    showError(data.error || "Failed to generate code.");
                    resetButton();
                }
            } catch (err) {
                showError("Network Error. Is the bot online?");
                resetButton();
            }
        }

        async function disconnectBot() {
            if(!confirm("Are you sure you want to disconnect this bot? The session will be deleted.")) return;
            
            const btn = document.getElementById('disconnectBtn');
            btn.innerText = "Disconnecting...";
            btn.disabled = true;

            try {
                await fetch(API_URL + "/api/disconnect", {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' 
                    },
                    body: JSON.stringify({ phoneNumber: currentPhone })
                });
                
                alert("Bot disconnected successfully.");
                window.location.reload(); 
            } catch (e) {
                alert("Failed to disconnect. Network error.");
                btn.innerText = "Disconnect Bot";
                btn.disabled = false;
            }
        }

        function resetButton() {
            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');
            btn.disabled = false;
            btnText.innerText = "Generate Code";
            spinner.style.display = "none";
        }

        function showError(msg) {
            const errorText = document.getElementById('errorText');
            errorText.innerText = msg;
            errorText.style.display = "block";
        }
    </script>
</body>
</html>
